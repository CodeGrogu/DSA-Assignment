<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Library Resource Manager</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Library & Resource Management System</h1>
        <p class="subtitle">Web Interface — DSA612S Q1</p>
    </header>

    <main>
        <section id="health-panel">
            <h2>Service Health</h2>
            <button id="check-health">Check Health</button>
            <pre id="health-output">Not checked yet.</pre>
        </section>

                <section id="assets-panel">
            <h2>All Assets</h2>
            <button id="load-assets">Load Assets</button>
            <p id="assets-status" class="status"></p>
            <table id="assets-table">
                <thead>
                    <tr>
                        <th>Asset Tag</th>
                        <th>Name</th>
                        <th>Institution</th>
                        <th>Site</th>
                        <th>Status</th>
                    </tr>
                </thead>
                <tbody id="assets-tbody"></tbody>
            </table>
        </section>
    </main>

    <script src="app.js"></script>
</body>
</html>
