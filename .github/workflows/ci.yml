name: Ballerina CI Quality Gate

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    name: Build, Format & Test Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Ballerina Swan Lake
        uses: ballerina-platform/setup-ballerina@v1.1.0
        with:
          version: 2201.13.5

      - name: Verify Code Formatting
        run: |
          echo "Verifying Ballerina code formatting across all packages..."
          for pkg in $(find . -maxdepth 2 -name "Ballerina.toml" -exec dirname {} \;); do
            echo "Checking format in: $pkg"
            (cd "$pkg" && bal format --dry-run)
          done

      - name: Run Automated Tests with Coverage
        run: |
          echo "Executing automated test suite across all packages..."
          for pkg in $(find . -maxdepth 2 -name "Ballerina.toml" -exec dirname {} \;); do
            echo "Running tests in: $pkg"
            (cd "$pkg" && bal test --test-report --code-coverage)
          done

      - name: Compile and Build Packages
        run: |
          echo "Compiling Ballerina packages..."
          for pkg in $(find . -maxdepth 2 -name "Ballerina.toml" -exec dirname {} \;); do
            echo "Building package in: $pkg"
            (cd "$pkg" && bal build)
          done
