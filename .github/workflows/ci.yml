name: Ballerina CI Quality Gate

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    name: Build, Format & Test Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Ballerina Swan Lake
        uses: ballerina-platform/setup-ballerina@v1.1.0
        with:
          version: 2201.13.5

      - name: Verify Code Formatting
        run: |
          echo "Verifying Ballerina code formatting..."
          bal format --dry-run

      - name: Run Automated Tests with Coverage
        run: |
          echo "Executing test suite across packages..."
          bal test --test-report --code-coverage

      - name: Compile and Build Packages
        run: |
          echo "Compiling Ballerina executables..."
          bal build
