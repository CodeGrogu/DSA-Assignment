$kind: http-request
name: 03. Update Property
method: POST
url: "{{grpc_host}}:{{grpc_port}}/rental.RentalService/update_property"
headers:
  - key: Content-Type
    value: application/grpc+proto
body:
  type: json
  content: |-
    {
      "assetTag": "{{propertyTag}}",
      "name": "Sunset Beachfront Villa Luxury Suite",
      "location": "Swakopmund",
      "propertyType": "Villa",
      "pricePerNight": 2800.0,
      "status": "AVAILABLE"
    }
description: |-
  ### Endpoint Overview
  Unary gRPC RPC updating property metadata (title, nightly rate, operational status) without clobbering omitted fields or re-indexing stored records.

  ---
  ### gRPC Method Specification
  - **Service**: `rental.RentalService`
  - **Method**: `update_property`
  - **Type**: Unary RPC
  - **URL / Path**: `{{grpc_host}}:{{grpc_port}}/rental.RentalService/update_property`

  ---
  ### Request Payload (`UpdatePropertyRequest`)
  - `assetTag` (*string*): Primary key identifier.
  - `name` (*string*): Updated property title.
  - `location` (*string*): Property location.
  - `propertyType` (*string*): Property type.
  - `pricePerNight` (*double*): Updated nightly price.
  - `status` (*string*): New status (`AVAILABLE`, `MAINTENANCE`, `RENTED`).

  ---
  ### Automated Test Assertions
  1. **Success Confirmation**: Asserts `success` is `true`.
  2. **Price Update Verification**: Validates `pricePerNight` was updated.
order: 3000
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Update property returned success", function () {
          var res = pm.response.json();
          pm.expect(res.success).to.be.true;
      });
      pm.test("Updated property details persisted", function () {
          var res = pm.response.json();
          pm.expect(res.property.pricePerNight).to.eql(2800.0);
      });
