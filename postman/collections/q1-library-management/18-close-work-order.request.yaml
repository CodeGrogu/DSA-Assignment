$kind: http-request
name: 18. Close Work Order
method: POST
url: "{{base_url}}:{{port}}/assets/{{assetTag}}/work-orders/{{orderId}}/close"
headers:
  - key: Accept
    value: application/json
description: |-
  ### Endpoint Overview
  Closes an active work order once all associated sub-tasks have been verified as completed.

  ---
  ### HTTP Specification
  - **Method**: `POST`
  - **URL**: `{{base_url}}:{{port}}/assets/{{assetTag}}/work-orders/{{orderId}}/close`
  - **Headers**:
    - `Accept`: `application/json`

  ---
  ### Automated Test Assertions
  1. **Status Code Check**: Asserts HTTP `200 OK`.
  2. **Work Order Closure Validation**: Confirms the work order status is transitioned to `CLOSED`.
order: 18000
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status code is 200 or 201", function () {
          pm.expect(pm.response.code).to.be.oneOf([200, 201]);
      });
      pm.test("Work order status is CLOSED", function () {
          var jsonData = pm.response.json();
          pm.expect(jsonData.status).to.equal("CLOSED");
      });
