$kind: http-request
name: 11. Remove Component from Asset
method: DELETE
url: "{{base_url}}:{{port}}/assets/{{assetTag}}/components/{{compId}}"
headers:
  - key: Accept
    value: application/json
description: |-
  ### Endpoint Overview
  Detaches and removes a specific component sub-part from an asset.

  ---
  ### HTTP Specification
  - **Method**: `DELETE`
  - **URL**: `{{base_url}}:{{port}}/assets/{{assetTag}}/components/{{compId}}`
  - **Headers**:
    - `Accept`: `application/json`

  ---
  ### Automated Test Assertions
  1. **Status Code Check**: Asserts HTTP `200 OK` or `204 No Content`.
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 200 or 204", function () {
          pm.expect(pm.response.code).to.be.oneOf([200, 204]);
      });
