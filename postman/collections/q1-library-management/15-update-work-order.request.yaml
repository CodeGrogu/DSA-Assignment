$kind: http-request
name: 15. Update Work Order
method: PUT
url: "{{base_url}}:{{port}}/assets/{{assetTag}}/work-orders/{{orderId}}"
headers:
  - key: Content-Type
    value: application/json
  - key: Accept
    value: application/json
body:
  type: json
  content: |-
    {
      "orderId": "WO-101",
      "status": "CLOSED",
      "description": "Replace worn gear motor assembly (Resolved)",
      "tasks": [
        {
          "taskId": "TSK-01",
          "description": "Disassemble outer casing",
          "completed": true
        }
      ]
    }
description: |-
  ### Endpoint Overview
  Updates the execution status or sub-task completion state of an active work order.

  ---
  ### HTTP Specification
  - **Method**: `PUT`
  - **URL**: `{{base_url}}:{{port}}/assets/{{assetTag}}/work-orders/{{orderId}}`
  - **Headers**:
    - `Content-Type`: `application/json`
    - `Accept`: `application/json`

  ---
  ### Automated Test Assertions
  1. **Status Code Check**: Asserts HTTP `200 OK`.
  2. **Work Order Resolution**: Validates status change to `CLOSED` and tasks marked as completed.
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 200", function () {
          pm.expect(pm.response.code).to.equal(200);
      });
