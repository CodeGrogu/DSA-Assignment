$kind: http-request
name: 15. Update Work Order
method: PUT
url: "{{base_url}}:{{port}}/assets/{{assetTag}}/work-orders/{{orderId}}"
headers:
  - key: Content-Type
    value: application/json
  - key: Accept
    value: application/json
body:
  type: json
  content: |-
    {
      "orderId": "WO-101",
      "status": "IN_PROGRESS",
      "description": "Replace worn gear motor assembly (In Progress)",
      "compId": "COMP-01",
      "tasks": [
        {
          "taskId": "TSK-01",
          "description": "Disassemble outer casing",
          "completed": true
        }
      ]
    }
description: |-
  ### Endpoint Overview
  Updates the execution status or sub-task completion state of an active work order.

  ---
  ### HTTP Specification
  - **Method**: `PUT`
  - **URL**: `{{base_url}}:{{port}}/assets/{{assetTag}}/work-orders/{{orderId}}`
  - **Headers**:
    - `Content-Type`: `application/json`
    - `Accept`: `application/json`

  ---
  ### Automated Test Assertions
  1. **Status Code Check**: Asserts HTTP `200 OK`.
  2. **Work Order Update Validation**: Validates status change to `IN_PROGRESS` and task `TSK-01` marked as completed.
order: 15000
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status code is 200", function () {
          pm.expect(pm.response.code).to.equal(200);
      });
      pm.test("Work order status is IN_PROGRESS", function () {
          var jsonData = pm.response.json();
          pm.expect(jsonData.status).to.equal("IN_PROGRESS");
      });
