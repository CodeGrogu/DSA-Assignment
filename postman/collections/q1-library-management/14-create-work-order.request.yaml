  ### HTTP Specification
  - **Method**: `POST`
  - **URL**: `{{base_url}}:{{port}}/assets/{{assetTag}}/work-orders`
  - **Headers**:
    - `Content-Type`: `application/json`
    - `Accept`: `application/json`

