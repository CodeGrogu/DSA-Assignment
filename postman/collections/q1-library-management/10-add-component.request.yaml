$kind: http-request
name: 10. Add Component to Asset
method: POST
url: "{{base_url}}:{{port}}/assets/{{assetTag}}/components"
headers:
  - key: Content-Type
    value: application/json
  - key: Accept
    value: application/json
body:
  type: json
  content: |-
    {
      "compId": "COMP-02",
      "name": "Optical Lens Unit",
      "description": "High magnification objective lens"
    }
description: |-
  ### Endpoint Overview
  Attaches a new modular component or sub-part item to an existing asset.

  ---
  ### HTTP Specification
  - **Method**: `POST`
  - **URL**: `{{base_url}}:{{port}}/assets/{{assetTag}}/components`
  - **Headers**:
    - `Content-Type`: `application/json`
    - `Accept`: `application/json`

  ---
  ### Automated Test Assertions
  1. **Status Code Check**: Asserts HTTP `201 Created` or `200 OK`.
  2. **Component Registration**: Verifies that `compId` is registered and returned.
order: 10000
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status code is 200 or 201", function () {
          pm.expect(pm.response.code).to.be.oneOf([200, 201]);
      });
